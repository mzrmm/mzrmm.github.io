<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>github | mzrmm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;900&display=swap" rel="stylesheet">
  <style>
    body {
      background: black;
      color: rgb(51, 255, 51);
      display: grid;
      font-family: "Inter", Helvetica, Arial, sans-serif;
      font-size: clamp(3.5rem, 17.5vw, 12.6rem);
      font-weight: 900;
      line-height: 1;
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
    }

    .pipe {
      color: white;
      font-family: "Inter", Helvetica, Arial, sans-serif;
      font-weight: 200;
    }
  </style>
</head>
<body>
  <main id="brand">MZ<span class="pipe">|</span>RMM</main>
  <script>
    (function () {
      var fonts = [
        "Arial, sans-serif",
        '"Times New Roman", Times, serif',
        "Helvetica, sans-serif",
        "Georgia, serif",
        "Verdana, sans-serif",
        '"Courier New", Courier, monospace',
        "Impact, Charcoal, sans-serif",
        '"Trebuchet MS", Helvetica, sans-serif',
        '"Comic Sans MS", cursive',
        '"Palatino Linotype", Palatino, serif',
        '"Lucida Console", Monaco, monospace',
        "Tahoma, Geneva, sans-serif",
        '"Segoe UI", Tahoma, sans-serif',
        "Garamond, Baskerville, serif",
        '"Franklin Gothic Medium", "Arial Narrow", sans-serif',
        "Optima, Candara, sans-serif",
        '"Gill Sans", "Gill Sans MT", Calibri, sans-serif'
      ];
      var el = document.getElementById("brand");
      var colors = [
        "rgb(51, 255, 51)",
        "#FFBF00",
        "#34ebe8",
        "#c934eb",
        "#ccff00"
      ];
      var frame = 0;
      var start = performance.now();
      var duration = 2000;
      var steadyMs = 1000;
      var startFps = 15;
      var endFps = 2;
      var startScale = 0.7;
      var endScale = 1;
      var endFont = '"Inter", Helvetica, Arial, sans-serif';

      el.style.color = colors[Math.floor(Math.random() * colors.length)];

      for (var i = fonts.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = fonts[i];
        fonts[i] = fonts[j];
        fonts[j] = tmp;
      }

      function delayFor(elapsed) {
        if (elapsed < steadyMs) return 1000 / startFps;
        var t = (elapsed - steadyMs) / (duration - steadyMs);
        var fps = startFps + (endFps - startFps) * t;
        return 1000 / Math.max(fps, endFps);
      }

      function applyScale(elapsed) {
        var t = Math.min(elapsed / duration, 1);
        var scale = startScale + (endScale - startScale) * t;
        el.style.transform = "scale(" + scale + ")";
      }

      function tick() {
        var elapsed = performance.now() - start;
        if (elapsed >= duration) {
          el.style.fontFamily = endFont;
          el.style.transform = "";
          return;
        }
        el.style.fontFamily = fonts[frame % fonts.length];
        applyScale(elapsed);
        frame += 1;
        setTimeout(tick, delayFor(elapsed));
      }

      applyScale(0);
      tick();
    })();
  </script>
</body>
</html>
